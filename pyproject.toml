[project]
name = "falconlite"
version = "0.1.0"
description = "Autonomous rocket landing simulator and evaluation platform."
authors = [
    { name = "Shawn" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy (>=2.4.6,<3.0.0)", "gymnasium (>=1.3.0,<2.0.0)", "pygame (>=2.6.1,<3.0.0)", "pyyaml (>=6.0.3,<7.0.0)", "pandas (>=3.0.3,<4.0.0)", "matplotlib (>=3.10.9,<4.0.0)"]

[tool.poetry]
packages = [{ include = "falconlite" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
